<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bethany Baptist Church Admin Center</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eef5fa;
    font-family: Arial, Helvetica, sans-serif;
    color: #17324d;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

.admin-app {
    width: 100%;
    max-width: 700px;
    min-height: 100vh;
    margin: auto;
    background: #f8fbfd;
}


/* HEADER */

.header {
    padding: 25px 20px;
    background: linear-gradient(135deg,#063765,#07578f);
    color: white;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-family: Georgia, serif;
    font-size: 27px;
}

.header p {
    margin: 7px 0 0;
    font-size: 13px;
    letter-spacing: 2px;
}


/* CONTENT */

.content {
    padding: 18px;
}

.card {
    margin-bottom: 18px;
    padding: 20px;
    border: 1px solid #d5e5f0;
    border-radius: 15px;
    background: white;
    box-shadow: 0 4px 12px rgba(20,70,110,.07);
}

.card h2 {
    margin: 0 0 18px;
    color: #073b6f;
    font-family: Georgia, serif;
    font-size: 22px;
}

.card h3 {
    margin: 0 0 8px;
    color: #07518a;
    font-family: Georgia, serif;
}


/* FORMS */

label {
    display: block;
    margin: 15px 0 6px;
    color: #294e6b;
    font-size: 13px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #bcd2e2;
    border-radius: 9px;
    background: white;
    color: #17324d;
    font-size: 16px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}


/* BUTTONS */

.primary-button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #07518a;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.primary-button:hover {
    background: #063e6a;
}

.secondary-button {
    padding: 9px 14px;
    border: 0;
    border-radius: 8px;
    background: #dcecf8;
    color: #073b6f;
    font-weight: bold;
    cursor: pointer;
}

.delete-button {
    padding: 9px 14px;
    border: 0;
    border-radius: 8px;
    background: #f7dddd;
    color: #8c2020;
    font-weight: bold;
    cursor: pointer;
}

.logout-button {
    margin-top: 12px;
    padding: 8px 18px;
    border: 1px solid rgba(255,255,255,.6);
    border-radius: 20px;
    background: transparent;
    color: white;
    cursor: pointer;
}


/* LOGIN */

#loginArea {
    max-width: 430px;
    margin: 35px auto;
}

.login-note {
    margin-bottom: 18px;
    color: #61788e;
    font-size: 13px;
    line-height: 1.5;
}

#errorMessage {
    margin-top: 12px;
    color: #a21e1e;
    font-size: 13px;
    font-weight: bold;
}

#successMessage {
    display: none;
    margin-bottom: 15px;
    padding: 12px;
    border-radius: 9px;
    background: #e4f4e8;
    color: #286338;
    font-weight: bold;
    text-align: center;
}


/* ADMIN */

#adminArea {
    display: none;
}

.admin-user {
    margin-top: 7px;
    font-size: 12px;
    opacity: .9;
}


/* ASSIGNMENTS */

.assignment-card {
    margin-bottom: 12px;
    padding: 15px;
    border: 1px solid #d6e5f0;
    border-radius: 12px;
    background: #fbfdff;
}

.assignment-ministry {
    color: #073b6f;
    font-family: Georgia, serif;
    font-size: 18px;
    font-weight: bold;
}

.assignment-date {
    margin-top: 5px;
    color: #07578f;
    font-weight: bold;
}

.assignment-service {
    margin-top: 7px;
    font-weight: bold;
}

.assignment-workers {
    margin-top: 5px;
    color: #405c72;
}

.assignment-notes {
    margin-top: 7px;
    color: #64798a;
    font-size: 13px;
    line-height: 1.4;
}

.assignment-actions {
    display: flex;
    gap: 8px;
    margin-top: 13px;
}

.empty-message {
    padding: 25px 10px;
    color: #718597;
    text-align: center;
}


/* VERSE */

.verse {
    padding: 5px 20px 30px;
    color: #45657e;
    text-align: center;
    font-family: Georgia, serif;
    font-style: italic;
    line-height: 1.5;
}

.verse strong {
    display: block;
    margin-top: 5px;
    font-style: normal;
}
</style>
</head>

<body>

<div class="admin-app">

    <div class="header">

        <h1>Bethany Baptist Church</h1>

        <p>ADMIN CENTER</p>

        <div
            id="adminUser"
            class="admin-user"
        ></div>

        <button
            id="logoutButton"
            class="logout-button"
            onclick="logout()"
            style="display:none;"
        >
            Sign Out
        </button>

    </div>


    <!-- LOGIN -->

    <div id="loginArea" class="content">

        <div class="card">

            <h2>Administrator Login</h2>

            <div class="login-note">
                Sign in with your authorized Bethany
                administrator account.
            </div>

            <label for="email">
                Email Address
            </label>

            <input
                id="email"
                type="email"
                autocomplete="username"
                placeholder="Email address"
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Password"
            >


            <button
                class="primary-button"
                onclick="login()"
            >
                SIGN IN
            </button>

            <div id="errorMessage"></div>

        </div>

    </div>



    <!-- ADMIN AREA -->

    <div id="adminArea" class="content">

        <div id="successMessage"></div>


        <!-- ADD ASSIGNMENT -->

        <div class="card">

            <h2 id="formTitle">
                Add Ministry Assignment
            </h2>


            <label for="ministry">
                Ministry / Schedule
            </label>

            <select id="ministry">

                <option value="">
                    Select a ministry...
                </option>

                <option value="bus">
                    Bus Ministry
                </option>

                <option value="nursery">
                    Church Nursery Schedule
                </option>

                <option value="shelter">
                    Shelter Meals
                </option>

                <option value="security">
                    Security Schedule
                </option>

                <option value="childrensChurch">
                    Children's Church Schedule
                </option>

                <option value="ladies">
                    Ladies Ministry
                </option>

                <option value="kingsKids">
                    King's Kids
                </option>

                <option value="youth">
                    Youth Ministry
                </option>

            </select>


            <label for="assignmentDate">
                Date
            </label>

            <input
                id="assignmentDate"
                type="date"
            >


            <label for="service">
                Service / Time
            </label>

            <input
                id="service"
                type="text"
                placeholder="Example: Sunday Morning"
            >


            <label for="workers">
                Assigned To
            </label>

            <input
                id="workers"
                type="text"
                placeholder="Example: Sarah & Emily"
            >


            <label for="notes">
                Notes
            </label>

            <textarea
                id="notes"
                placeholder="Example: Please arrive by 10:15 AM"
            ></textarea>


            <button
                id="publishButton"
                class="primary-button"
                onclick="saveAssignment()"
            >
                PUBLISH ASSIGNMENT
            </button>


            <button
                id="cancelEditButton"
                class="secondary-button"
                onclick="cancelEdit()"
                style="
                    display:none;
                    width:100%;
                    margin-top:10px;
                "
            >
                Cancel Edit
            </button>

        </div>



        <!-- EXISTING ASSIGNMENTS -->

        <div class="card">

            <h2>
                Current Assignments
            </h2>

            <div id="assignmentList">

                <div class="empty-message">
                    Loading assignments...
                </div>

            </div>

        </div>

    </div>


    <div class="verse">

        “Let all things be done decently and in order.”

        <strong>
            1 Corinthians 14:40 KJV
        </strong>

    </div>

</div>



<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>


<script>

/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
    "AIzaSyB7CVFqwPbjLlH5vhvGKlMAH9gtBFnM458",

    authDomain:
    "calendar-a6f0f.firebaseapp.com",

    databaseURL:
    "https://calendar-a6f0f-default-rtdb.firebaseio.com",

    projectId:
    "calendar-a6f0f",

    storageBucket:
    "calendar-a6f0f.firebasestorage.app",

    messagingSenderId:
    "41941951557",

    appId:
    "1:41941951557:web:739ded386d42190c97ef2c"

};


firebase.initializeApp(firebaseConfig);

const auth =
    firebase.auth();

const database =
    firebase.database();

const assignmentsRef =
    database.ref("assignments");


let editingId = null;

let assignments = {};



/* AUTHENTICATION */

auth.onAuthStateChanged(function(user) {

    if (user) {

        document.getElementById("loginArea")
        .style.display = "none";

        document.getElementById("adminArea")
        .style.display = "block";

        document.getElementById("logoutButton")
        .style.display = "inline-block";

        document.getElementById("adminUser")
        .textContent = user.email;

        loadAssignments();

    }

    else {

        document.getElementById("loginArea")
        .style.display = "block";

        document.getElementById("adminArea")
        .style.display = "none";

        document.getElementById("logoutButton")
        .style.display = "none";

        document.getElementById("adminUser")
        .textContent = "";

    }

});



function login() {

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;


    document.getElementById("errorMessage")
    .textContent = "";


    if (!email || !password) {

        document.getElementById("errorMessage")
        .textContent =
        "Please enter your email address and password.";

        return;
    }


    auth.signInWithEmailAndPassword(
        email,
        password
    )
    .catch(function(error) {

        console.error(error);

        document.getElementById("errorMessage")
        .textContent =
        "Unable to sign in. Please check your email and password.";

    });

}



function logout() {

    auth.signOut();

}



/* SAVE ASSIGNMENT */

function saveAssignment() {

    const ministry =
        document.getElementById("ministry").value;

    const date =
        document.getElementById("assignmentDate").value;

    const service =
        document.getElementById("service").value.trim();

    const workers =
        document.getElementById("workers").value.trim();

    const notes =
        document.getElementById("notes").value.trim();


    if (!ministry) {

        alert(
            "Please select a ministry or schedule."
        );

        return;
    }


    if (!date) {

        alert(
            "Please select a date."
        );

        return;
    }


    if (!workers) {

        alert(
            "Please enter who is assigned."
        );

        return;
    }


    const assignmentData = {

        ministry: ministry,

        date: date,

        service: service,

        workers: workers,

        notes: notes,

        updatedAt:
            firebase.database.ServerValue.TIMESTAMP

    };


    if (editingId) {

        assignmentsRef
        .child(editingId)
        .update(assignmentData)

        .then(function() {

            showSuccess(
                "Assignment updated successfully."
            );

            resetForm();

        })

        .catch(function(error) {

            console.error(error);

            alert(
                "The assignment could not be updated."
            );

        });

    }

    else {

        assignmentData.createdAt =
            firebase.database.ServerValue.TIMESTAMP;


        assignmentsRef
        .push(assignmentData)

        .then(function() {

            showSuccess(
                "Assignment published successfully."
            );

            resetForm();

        })

        .catch(function(error) {

            console.error(error);

            alert(
                "The assignment could not be published."
            );

        });

    }

}



/* LOAD ASSIGNMENTS */

function loadAssignments() {

    assignmentsRef.off();


    assignmentsRef.on(
        "value",
        function(snapshot) {

            assignments =
                snapshot.val() || {};

            renderAssignments();

        },

        function(error) {

            console.error(error);

            document.getElementById(
                "assignmentList"
            ).innerHTML =
                '<div class="empty-message">' +
                'Unable to load assignments.' +
                '</div>';

        }
    );

}



/* DISPLAY ASSIGNMENTS */

function renderAssignments() {

    const list =
        document.getElementById(
            "assignmentList"
        );


    list.innerHTML = "";


    const items =
        Object.keys(assignments)
        .map(function(id) {

            return {
                id: id,
                ...assignments[id]
            };

        });


    items.sort(function(a,b) {

        return (a.date || "")
        .localeCompare(b.date || "");

    });


    if (!items.length) {

        list.innerHTML =
            '<div class="empty-message">' +
            'No ministry assignments have been added yet.' +
            '</div>';

        return;
    }


    items.forEach(function(item) {

        const card =
            document.createElement("div");

        card.className =
            "assignment-card";


        const ministry =
            document.createElement("div");

        ministry.className =
            "assignment-ministry";

        ministry.textContent =
            ministryName(item.ministry);


        const date =
            document.createElement("div");

        date.className =
            "assignment-date";

        date.textContent =
            formatDisplayDate(item.date);


        card.appendChild(ministry);
        card.appendChild(date);


        if (item.service) {

            const service =
                document.createElement("div");

            service.className =
                "assignment-service";

            service.textContent =
                item.service;

            card.appendChild(service);

        }


        const workers =
            document.createElement("div");

        workers.className =
            "assignment-workers";

        workers.textContent =
            "Assigned: " +
            (item.workers || "");

        card.appendChild(workers);


        if (item.notes) {

            const notes =
                document.createElement("div");

            notes.className =
                "assignment-notes";

            notes.textContent =
                item.notes;

            card.appendChild(notes);

        }


        const actions =
            document.createElement("div");

        actions.className =
            "assignment-actions";


        const editButton =
            document.createElement("button");

        editButton.className =
            "secondary-button";

        editButton.textContent =
            "Edit";

        editButton.onclick =
            function() {
                editAssignment(item.id);
            };


        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete-button";

        deleteButton.textContent =
            "Delete";

        deleteButton.onclick =
            function() {
                deleteAssignment(item.id);
            };


        actions.appendChild(editButton);
        actions.appendChild(deleteButton);

        card.appendChild(actions);

        list.appendChild(card);

    });

}



/* EDIT */

function editAssignment(id) {

    const item =
        assignments[id];

    if (!item) {
        return;
    }


    editingId = id;


    document.getElementById("ministry").value =
        item.ministry || "";

    document.getElementById("assignmentDate").value =
        item.date || "";

    document.getElementById("service").value =
        item.service || "";

    document.getElementById("workers").value =
        item.workers || "";

    document.getElementById("notes").value =
        item.notes || "";


    document.getElementById("formTitle")
    .textContent =
        "Edit Ministry Assignment";


    document.getElementById("publishButton")
    .textContent =
        "SAVE CHANGES";


    document.getElementById("cancelEditButton")
    .style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* DELETE */

function deleteAssignment(id) {

    const item =
        assignments[id];

    if (!item) {
        return;
    }


    const answer =
        confirm(
            "Delete this " +
            ministryName(item.ministry) +
            " assignment?"
        );


    if (!answer) {
        return;
    }


    assignmentsRef
    .child(id)
    .remove()

    .then(function() {

        showSuccess(
            "Assignment deleted."
        );

        if (editingId === id) {
            resetForm();
        }

    })

    .catch(function(error) {

        console.error(error);

        alert(
            "The assignment could not be deleted."
        );

    });

}



/* CANCEL EDIT */

function cancelEdit() {

    resetForm();

}



/* RESET FORM */

function resetForm() {

    editingId = null;

    document.getElementById("ministry").value =
        "";

    document.getElementById("assignmentDate").value =
        "";

    document.getElementById("service").value =
        "";

    document.getElementById("workers").value =
        "";

    document.getElementById("notes").value =
        "";


    document.getElementById("formTitle")
    .textContent =
        "Add Ministry Assignment";


    document.getElementById("publishButton")
    .textContent =
        "PUBLISH ASSIGNMENT";


    document.getElementById("cancelEditButton")
    .style.display =
        "none";

}



/* SUCCESS */

function showSuccess(message) {

    const box =
        document.getElementById(
            "successMessage"
        );


    box.textContent =
        message;

    box.style.display =
        "block";


    setTimeout(function() {

        box.style.display =
            "none";

    }, 3500);

}



/* MINISTRY NAMES */

function ministryName(value) {

    const names = {

        bus:
            "Bus Ministry",

        nursery:
            "Church Nursery Schedule",

        shelter:
            "Shelter Meals",

        security:
            "Security Schedule",

        childrensChurch:
            "Children's Church Schedule",

        ladies:
            "Ladies Ministry",

        kingsKids:
            "King's Kids",

        youth:
            "Youth Ministry"

    };


    return names[value] ||
        "Ministry Assignment";

}



/* DATE DISPLAY */

function formatDisplayDate(dateString) {

    if (!dateString) {
        return "";
    }


    const parts =
        dateString.split("-");


    const date =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );


    return date.toLocaleDateString(
        "en-US",
        {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        }
    );

}



/* PASSWORD ENTER KEY */

document.getElementById("password")
.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            login();
        }

    }
);

</script>

</body>
</html>
